# Default System One Router model pool.
# Tiers map to Jev routing tiers; registration order is the deterministic
# tie-break when a tier contains multiple profiles.
# Prices are USD per million tokens, taken from the OpenRouter models API (Nov 2026).
models:
  fast:
    - id: google/gemini-2.5-flash
      provider: openrouter
      capabilities:
        reasoning: 2
        coding: 3
        vision: true
      cost:
        input_per_million: 0.3
        output_per_million: 2.5

  balanced:
    - id: openai/gpt-6.1-terra
      provider: openrouter
      capabilities:
        reasoning: 3
        coding: 4
        vision: true
      cost:
        input_per_million: 1.0
        output_per_million: 5.0

  reasoning:
    - id: anthropic/claude-sonnet-5.5
      provider: openrouter
      capabilities:
        reasoning: 5
        coding: 5
        vision: true
      cost:
        input_per_million: 2.0
        output_per_million: 10.0
